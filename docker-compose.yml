services:
  api:
    build: ./backend
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build: ./backend
    env_file:
      - ./backend/.env
    command: celery -A app.tasks.celery_app.celery_app worker --beat --loglevel=info

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
