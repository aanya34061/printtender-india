services:
  # --- FastAPI web service ---
  - type: web
    name: printtender-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && playwright install chromium --with-deps
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    healthCheckPath: /health
    envVars:
      - fromGroup: printtender-env

  # --- Celery worker ---
  - type: worker
    name: printtender-worker
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && playwright install chromium --with-deps
    startCommand: celery -A app.tasks.celery_app.celery_app worker --beat --loglevel=info --concurrency=2
    plan: free
    envVars:
      - fromGroup: printtender-env

  # --- Celery beat scheduler (cron every 6 h) ---
  - type: cron
    name: printtender-scheduler
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && playwright install chromium --with-deps
    startCommand: python -c "import asyncio; from app.tasks.fetch_job import run_fetch_cycle; print(asyncio.run(run_fetch_cycle()))"
    schedule: "0 */6 * * *"
    envVars:
      - fromGroup: printtender-env

  # --- Scheduled subscriber mails: 09:00 and 19:00 IST (03:30 and 13:30 UTC) ---
  - type: cron
    name: printtender-mail-scheduler-main
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && playwright install chromium --with-deps
    startCommand: python -c "import asyncio; from app.tasks.fetch_job import send_scheduled_subscriber_mails; print(asyncio.run(send_scheduled_subscriber_mails()))"
    schedule: "30 3,13 * * *"
    envVars:
      - fromGroup: printtender-env

  # --- Scheduled subscriber mails: 13:30 IST (08:00 UTC) ---
  - type: cron
    name: printtender-mail-scheduler-afternoon
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && playwright install chromium --with-deps
    startCommand: python -c "import asyncio; from app.tasks.fetch_job import send_scheduled_subscriber_mails; print(asyncio.run(send_scheduled_subscriber_mails()))"
    schedule: "0 8 * * *"
    envVars:
      - fromGroup: printtender-env

envVarGroups:
  - name: printtender-env
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_USE_TLS
        value: "true"
      - key: APP_ENV
        value: production
      - key: ENABLE_SCHEDULED_MAILS
        value: "true"
      - key: FETCH_INTERVAL_HOURS
        value: "6"
      - key: MAX_TENDERS_PER_KEYWORD
        value: "100"
      - key: REQUEST_DELAY_SECONDS
        value: "3"
