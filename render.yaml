services:
  - type: web
    name: printtender-backend
    env: python
    rootDir: backend
    buildCommand: "pip install -r requirements.txt && playwright install chromium --with-deps"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: FRONTEND_URL
        value: "https://printtender-india-frontend.vercel.app"
      - key: BACKEND_URL
        sync: false
